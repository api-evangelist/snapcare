aid: snapcare
name: SnapCare
description: >-
  SnapCare is an Atlanta-based healthcare workforce company, founded in 2017 as SnapNurse and
  relaunched under the SnapCare name in 2023, that pairs a national clinician marketplace with
  Booker, its SaaS workforce platform for hospitals, post-acute facilities, agency suppliers and
  clinicians. Booker combines predictive scheduling against census and historical demand trends,
  real-time per-diem shift fulfillment, internal float-pool management, same-day pay, and
  escalation of unfilled shifts to approved contingent suppliers. SnapCare acquired predictive
  staffing analytics vendor Medecipher in 2024 and merged with the nurse community connectRN in
  April 2026, raising a Series A led by Suvretta Capital. SnapCare sells the platform to healthcare
  organizations rather than to developers; no public developer program, API reference, or
  machine-readable API contract was found on its public surface.
